<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Browse YouTube Music and play it on your phone or TV."
    />
    <meta
      name="theme-color"
      content="#fdfdfd"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0c0e"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <!-- No apple-mobile-web-app-status-bar-style: with black-translucent
         iOS blurs the top of the app whatever the page draws (see
         .status-bar-color in styles.css). iOS reads this at install, so a
         change needs the app re-added to the Home Screen. -->
    <meta name="apple-mobile-web-app-title" content="Joshify" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link href="/src/styles.css" rel="stylesheet" />
    <title>Joshify</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Gives iOS the status bar color from the first frame; see
         .status-bar-color in styles.css. -->
    <div
      class="status-bar-color status-bar-color-page"
      aria-hidden="true"
    ></div>
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
